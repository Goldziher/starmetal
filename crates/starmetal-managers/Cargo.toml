[package]
name = "starmetal-managers"
description = "Manifest managers (parse/patch) for the Starmetal dependency-update engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["cargo"]
cargo = ["dep:toml"]

[dependencies]
starmetal-core.workspace = true
starmetal-update-core.workspace = true
toml = { workspace = true, optional = true, features = ["preserve_order"] }
