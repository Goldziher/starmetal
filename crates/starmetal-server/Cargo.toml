[package]
name = "starmetal-server"
description = "HTTP server and Tower middleware stack for Starmetal"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.cargo-machete]
ignored = ["starmetal-adapters", "starmetal-storage", "tokio", "tower", "tracing"]

[features]
default = ["pypi", "npm", "cargo-registry", "hex"]
pypi = ["starmetal-adapters/pypi"]
npm = ["starmetal-adapters/npm"]
cargo-registry = ["starmetal-adapters/cargo-registry"]
hex = ["starmetal-adapters/hex"]
maven = ["starmetal-adapters/maven"]
rubygems = ["starmetal-adapters/rubygems"]
nuget = ["starmetal-adapters/nuget"]
pub = ["starmetal-adapters/pub"]
# Only the `GitMirror` port is needed here (to type the state's mirror handle) — the concrete
# gitoxide backend is selected in `starmetal-ops`.
go = ["starmetal-adapters/go", "dep:starmetal-git"]
# Same shape as `go` — only the `GitMirror` port is needed here.
zig = ["starmetal-adapters/zig", "dep:starmetal-git"]

[dependencies]
axum.workspace = true
serde.workspace = true
starmetal-adapters = { workspace = true, default-features = false }
starmetal-authz.workspace = true
starmetal-core.workspace = true
starmetal-git = { workspace = true, optional = true }
starmetal-storage = { workspace = true, default-features = false }
tokio.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
