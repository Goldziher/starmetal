[package]
name = "starmetal-cli"
description = "sm CLI binary for the Starmetal package registry"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/Goldziher/starmetal"

[package.metadata.cargo-machete]
ignored = ["starmetal-adapters", "starmetal-storage", "serde"]

# ~keep cargo-binstall support: release assets are named starmetal-{target}{archive-suffix}
# ~keep with the `sm` binary at the archive root, which doesn't match binstall's default
# ~keep {name}-{version}-{target} naming, so pin the download URL and bin-dir explicitly.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/starmetal-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"

[[bin]]
name = "sm"
path = "src/main.rs"

[features]
default = ["full"]
full = [
  "pypi",
  "npm",
  "cargo-registry",
  "hex",
  "maven",
  "rubygems",
  "nuget",
  "pub",
  "backend-fs",
  "update",
  "metadata",
  "oidc",
  "scanner-osv",
]
update = [
  "dep:starmetal-update-core",
  "dep:starmetal-updater",
  "dep:starmetal-forge",
  "starmetal-forge/github",
  "starmetal-ops/update",
]
pypi = ["starmetal-adapters/pypi", "starmetal-ops/pypi", "starmetal-server/pypi"]
npm = ["starmetal-adapters/npm", "starmetal-ops/npm", "starmetal-server/npm"]
cargo-registry = [
  "starmetal-adapters/cargo-registry",
  "starmetal-ops/cargo-registry",
  "starmetal-server/cargo-registry",
]
hex = ["starmetal-adapters/hex", "starmetal-ops/hex", "starmetal-server/hex"]
maven = ["starmetal-adapters/maven", "starmetal-ops/maven", "starmetal-server/maven"]
rubygems = ["starmetal-adapters/rubygems", "starmetal-ops/rubygems", "starmetal-server/rubygems"]
nuget = ["starmetal-adapters/nuget", "starmetal-ops/nuget", "starmetal-server/nuget"]
pub = ["starmetal-adapters/pub", "starmetal-ops/pub", "starmetal-server/pub"]
backend-fs = ["starmetal-ops/backend-fs", "starmetal-storage/backend-fs"]
backend-memory = ["starmetal-ops/backend-memory", "starmetal-storage/backend-memory"]
backend-s3 = ["starmetal-ops/backend-s3", "starmetal-storage/backend-s3"]
backend-gcs = ["starmetal-ops/backend-gcs", "starmetal-storage/backend-gcs"]
pq = ["starmetal-core/pq", "starmetal-ops/pq"]
signing-x509 = ["starmetal-core/signing-x509", "starmetal-ops/signing-x509"]
metadata = ["starmetal-ops/metadata"]
oidc = ["starmetal-ops/oidc"]
scanner-osv = ["starmetal-ops/scanner-osv"]

[dependencies]
axum.workspace = true
clap.workspace = true
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
starmetal-adapters = { workspace = true, default-features = false }
starmetal-core.workspace = true
starmetal-forge = { workspace = true, optional = true }
starmetal-ops = { workspace = true, default-features = false }
starmetal-server = { workspace = true, default-features = false }
starmetal-storage = { workspace = true, default-features = false }
starmetal-update-core = { workspace = true, optional = true }
starmetal-updater = { workspace = true, optional = true }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
