[package]
name = "starmetal-forge"
description = "Forge backends (GitHub, etc.) for the Starmetal dependency-update engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.cargo-machete]
# tokio: dev-only runtime for the ignored live integration test.
ignored = ["tokio"]

[features]
default = ["github"]
github = ["dep:octocrab", "dep:base64", "dep:url"]

[dependencies]
async-trait.workspace = true
base64 = { workspace = true, optional = true }
octocrab = { workspace = true, optional = true }
secrecy.workspace = true
serde_json.workspace = true
starmetal-update-core.workspace = true
tracing.workspace = true
url = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }
