[package]
name = "starmetal-adapters"
description = "Protocol adapters (PyPI, npm, Cargo, Hex) for Starmetal"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.cargo-machete]
ignored = [
  "ahash",
  "async-trait",
  "axum",
  "bytes",
  "starmetal-core",
  "reqwest",
  "serde",
  "serde_json",
  "thiserror",
  "tokio",
  "tracing",
]

[features]
default = ["pypi", "npm", "cargo-registry", "hex"]
pypi = []
npm = []
cargo-registry = []
hex = []
maven = []
rubygems = []
nuget = []
pub = []
scanner-osv = []
# GOPROXY protocol adapter (ADR-0023), backed by the `starmetal-git` GitMirror port. Only the
# port trait is pulled in here — the gitoxide-backed implementation is selected at assembly time
# in `starmetal-ops`, so this crate never depends on a git library directly.
go = ["dep:starmetal-git", "dep:chrono", "dep:semver"]
# Zig source-tarball proxy (ADR-0023), backed by the same `starmetal-git` GitMirror port as `go`.
# No version validation or timestamp document is needed (`zig fetch` hashes the tarball itself), so
# unlike `go` this feature pulls in neither `chrono` nor `semver`.
zig = ["dep:starmetal-git"]
# Swift Package Registry proxy (ADR-0023, SE-0292), backed by the same `starmetal-git` GitMirror
# port as `go`/`zig`. Needs `semver` for release-version validation (like `go`), but no `chrono`: the
# registry protocol has no timestamp document. `sha2` and `zip` are already unconditional
# dependencies of this crate.
swift = ["dep:starmetal-git", "dep:semver"]

[dependencies]
ahash.workspace = true
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
bytes.workspace = true
chrono = { workspace = true, optional = true }
flate2.workspace = true
hex.workspace = true
prost.workspace = true
reqwest.workspace = true
semver = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha1.workspace = true
sha2.workspace = true
starmetal-core.workspace = true
starmetal-git = { workspace = true, optional = true }
tar.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
zip.workspace = true

[dev-dependencies]
# Test-only: exercises the `go` adapter against a real fixture repository built with the `git`
# CLI, so the gitoxide-backed GitMirror impl is needed here even though the adapter itself only
# depends on the port (see the `go` feature comment above).
starmetal-git = { workspace = true, features = ["gix-backend"] }
tempfile.workspace = true
