
version = "5.0"
name = 'starmetal'
description = 'Multi-language high-performance self-hosted package registry and registry proxy'
gitignore = true
presets = ["claude", "codex", "opencode", "pi"]
builtins = ['rust', 'default-commands']

[[marketplaces]]
name = "basemind"
source = "Goldziher/basemind"
type = "github"

[[plugins]]
marketplace = "basemind"
name = "basemind"
scope = "project"
enabled = true

[[mcp_servers]]
name = "ai-rulez"
command = "pnpm"
args = ["dlx", "ai-rulez@latest", "mcp"]

# Pinned by `ai-rulez migrate v5`: the 4.x default. Remove this line to take the v5 default.
[header]
text = """
AI-RULEZ :: GENERATED FILE — DO NOT EDIT
Source: .ai-rulez/config.toml and .ai-rulez/
Regenerate: pnpm dlx ai-rulez@5.0.1 generate
Use MCP server: pnpm dlx ai-rulez@5.0.1 mcp
"""
hashes = "full"

[mcp]
self_server_command = ["pnpm", "dlx", "ai-rulez@5.0.1", "mcp"]
