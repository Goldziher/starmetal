[graph]
all-features = true

[advisories]
unmaintained = "workspace"
unsound = "all"
yanked = "deny"
unused-ignored-advisory = "warn"
ignore = [
  { id = "RUSTSEC-2023-0071", reason = "rsa (Marvin timing sidechannel in RSA private-key ops) is pulled via OpenDAL GCS (reqsign-google) and by starmetal-oidc, which uses rsa for RS256 signature VERIFICATION only (public-key ops, not affected by the private-key timing oracle). No fixed rsa version exists. Remove when upstream ships a fix." },
  { id = "RUSTSEC-2026-0194", reason = "quick-xml is pulled through OpenDAL core/services and reqsign. OpenDAL 0.57 and reqsign-aws-v4 3.0.1 have no fixed crates.io release yet. Temporary until 2026-08-15; remove when upstream allows quick-xml >= 0.41." },
  { id = "RUSTSEC-2026-0195", reason = "quick-xml is pulled through OpenDAL core/services and reqsign. OpenDAL 0.57 and reqsign-aws-v4 3.0.1 have no fixed crates.io release yet. Temporary until 2026-08-15; remove when upstream allows quick-xml >= 0.41." },
]

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.8
include-dev = true
unused-allowed-license = "deny"
unused-license-exception = "deny"

# uluru is an unmodified LRU-cache dependency pulled by gix-pack (gitoxide's object
# database, a non-optional part of the starmetal-git mirror). MPL-2.0 is OSI-approved,
# FSF-Free, and only weak file-level copyleft: using the crate unmodified imposes no
# obligation on Starmetal's own sources. Scoped to this one crate rather than allowing
# MPL-2.0 workspace-wide.
[[licenses.exceptions]]
allow = ["MPL-2.0"]
name = "uluru"

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "allow"
allow-workspace = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
unused-allowed-source = "deny"
