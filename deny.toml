[graph]
all-features = true

[advisories]
unmaintained = "workspace"
unsound = "all"
yanked = "deny"
unused-ignored-advisory = "warn"
ignore = [
  { id = "RUSTSEC-2023-0071", reason = "rsa (Marvin timing sidechannel in RSA private-key ops) is pulled via OpenDAL GCS (reqsign-google) and by starmetal-oidc, which uses rsa for RS256 signature VERIFICATION only (public-key ops, not affected by the private-key timing oracle). No fixed rsa version exists. Remove when upstream ships a fix." },
  { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 comes through elliptic-curve 0.13 (p256/p384 0.13, jsonwebtoken 10 via octocrab ^10); the fix is crypto-bigint 0.7, which only the 0.14 RustCrypto line uses. Starmetal's production EC code only verifies ES256 signatures (public inputs); EC signing happens in tests. Remove when octocrab allows jsonwebtoken 11 and p256 moves to 0.14." },
  { id = "RUSTSEC-2026-0367", reason = "zip 8: fixed only in zip 9, whose ZipFile::name() returns a Result and needs adapter changes. The advisory covers ZipArchive::extract, which Starmetal never calls; it reads entries by index/name. Remove with the zip 9 upgrade." },
  { id = "RUSTSEC-2026-0368", reason = "zip 8: fixed only in zip 9 (see RUSTSEC-2026-0367). Affects ZipArchive::extract symlink handling; Starmetal never extracts archives to disk. Remove with the zip 9 upgrade." },
  { id = "RUSTSEC-2026-0369", reason = "zip 8: fixed only in zip 9 (see RUSTSEC-2026-0367). Affects ZipStreamReader/ZipArchive::extract permissions; Starmetal never extracts archives to disk. Remove with the zip 9 upgrade." },
  { crate = "bisync@0.3.0", reason = "Every bisync release is yanked; gix-protocol 0.64 (gix 0.86) still requires it and gix-protocol 0.68 drops it. Remove with the gix upgrade." },
]

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.8
include-dev = true
unused-allowed-license = "deny"
unused-license-exception = "deny"

# uluru is an unmodified LRU-cache dependency pulled by gix-pack (gitoxide's object
# database, a non-optional part of the starmetal-git mirror). MPL-2.0 is OSI-approved,
# FSF-Free, and only weak file-level copyleft: using the crate unmodified imposes no
# obligation on Starmetal's own sources. Scoped to this one crate rather than allowing
# MPL-2.0 workspace-wide.
[[licenses.exceptions]]
allow = ["MPL-2.0"]
name = "uluru"

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "allow"
allow-workspace = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
unused-allowed-source = "deny"
