[workspace]
resolver = "3"
members = [
    "crates/starmetal-adapters",
    "crates/starmetal-cli",
    "crates/starmetal-core",
    "crates/starmetal-ops",
    "crates/starmetal-server",
    "crates/starmetal-service",
    "crates/starmetal-storage",
    "tests/conformance",
    "tests/integration",
    "tools/schema-manager",
    "tools/test-generator",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]

ahash = { version = "0.8", features = ["serde"] }

async-trait = "0.1"

axum = { version = "0.8", features = ["multipart"] }

base64 = "0.22"

blake3 = "1"

bytes = "1"

chrono = { version = "0.4", features = ["serde"] }

clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["pkcs8"] }

flate2 = "1"

hex = "0.4"

jsonschema = "0.46"

memchr = "2"

opendal = "0.57"
pem-rfc7468 = "1"
pkcs8 = { version = "0.11", features = ["pem"] }
prost = "0.14"
rand_core = "0.10"

reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }

rmcp = { version = "2.1.0", default-features = false, features = ["macros", "server", "transport-io"] }

schemars = "1.2"
secrecy = "0.10"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9.34"
sha1 = "0.11"
sha2 = "0.11"
starmetal-adapters = { path = "crates/starmetal-adapters", default-features = false }

starmetal-core = { path = "crates/starmetal-core" }
starmetal-ops = { path = "crates/starmetal-ops", default-features = false }
starmetal-server = { path = "crates/starmetal-server", default-features = false }
starmetal-service = { path = "crates/starmetal-service" }
starmetal-storage = { path = "crates/starmetal-storage", default-features = false }
tar = "0.4.46"

tempfile = "3"

thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "1.1"
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.7", features = ["cors", "compression-full", "limit", "trace"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
x509-parser = "0.18"
zeroize = "1"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
