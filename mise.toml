# Versions follow the xberg-io/toolchains baseline named in toolchains.toml. Rust follows the stable
# channel through rustup, not this file. ~keep
[settings]
lockfile = true
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-arm64", "windows-x64"]
# CI installs only the tools a job needs; `mise run` must not install the rest behind its back. ~keep
task.run_auto_install = false

[tools]
"github:Goldziher/poly" = "0.31.2"
actionlint = "1.7.12"
node = "26.12.1"
pnpm = "12.15.0"
python = "3.13.18"
uv = "0.13.6"
go = "1.27.3"
zig = "0.17.0"
ruby = "3.4.12"
java = "temurin-25.0.5+8.0.LTS"
maven = "3.10.0"
cargo-deny = "0.20.2"
# Repository-owned: the advisory scanner `security` runs. ~keep
"github:rustsec/rustsec" = { version = "0.22.1", version_prefix = "cargo-audit/v" }
# Repository-owned: generates crates/starmetal-metadata/src/generated from crates/*/sql. ~keep
"github:Goldziher/scythe" = "0.20.1"

[env]
# Cargo uses an sccache found on the caller's PATH (`mise run setup:sccache` installs one globally); an
# empty RUSTC_WRAPPER means no wrapper. Not in [tools]: template exec does not see mise tool paths. ~keep
RUSTC_WRAPPER = "{{ exec(command='command -v sccache || true') }}"

[task_config]
includes = ["mise-tasks", "mise-tasks/shared.toml"]
