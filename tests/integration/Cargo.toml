[package]
name = "starmetal-integration-tests"
description = "Integration tests for starmetal"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
# Off by default: pulls the Postgres content store (ADR-0020) plus testcontainers so a test can drive
# a real store through `TestServerBuilder::with_content_store`. Kept behind a feature so the default
# integration suite stays offline and Docker-free (the metadata tests are `#[ignore]`d, like the
# metadata crate's own suite).
metadata = ["dep:starmetal-metadata", "dep:testcontainers", "dep:testcontainers-modules"]
# Off by default: fronts the flat-token authorizer with a static-JWKS OIDC `CompositeAuthenticator`
# (ADR-0022) when `config.oidc.enabled`, mirroring `starmetal-ops`'s `oidc` feature.
oidc = ["dep:starmetal-oidc"]

[dependencies]
ahash.workspace = true
async-trait.workspace = true
axum.workspace = true
blake3.workspace = true
ed25519-dalek = { workspace = true, features = ["alloc"] }
pkcs8.workspace = true
reqwest = { workspace = true, features = ["multipart"] }
starmetal-adapters = { workspace = true, features = [
  "cargo-registry",
  "go",
  "hex",
  "maven",
  "npm",
  "nuget",
  "pypi",
  "pub",
  "rubygems",
  "swift",
  "zig",
] }
starmetal-core = { workspace = true, features = ["test-support"] }
starmetal-git = { workspace = true, features = ["gix-backend"] }
starmetal-metadata = { workspace = true, optional = true }
starmetal-oidc = { workspace = true, optional = true }
starmetal-server = { workspace = true, features = [
  "cargo-registry",
  "go",
  "hex",
  "maven",
  "npm",
  "nuget",
  "pypi",
  "pub",
  "rubygems",
  "swift",
  "zig",
] }
starmetal-service.workspace = true
starmetal-storage = { workspace = true, features = ["backend-memory"] }
tempfile.workspace = true
testcontainers = { workspace = true, optional = true }
testcontainers-modules = { workspace = true, optional = true }
tokio.workspace = true

[dev-dependencies]
base64.workspace = true
bytes.workspace = true
flate2.workspace = true
hex.workspace = true
p256 = { workspace = true, features = ["ecdsa"] }
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zip.workspace = true
