name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  toolchain:
    name: toolchain baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: xberg-io/actions/check-toolchain@v1

  validate:
    uses: xberg-io/actions/.github/workflows/reusable-validate.yml@v1
    with:
      setup-rust: true

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: xberg-io/actions/setup-mise@v1
        with:
          install: "false"
      - run: mise run fmt:check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: xberg-io/actions/setup-mise@v1
        with:
          install: "false"
      - run: mise run clippy

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - uses: xberg-io/actions/setup-mise@v1
        with:
          install: "false"
      - run: mise run test:all

  schema:
    name: schema
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - uses: xberg-io/actions/setup-mise@v1
        with:
          install: "false"
      - run: mise run schema:check
      - run: mise run schema:validate

  conformance:
    name: conformance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - uses: xberg-io/actions/setup-mise@v1
        with:
          install: "false"
      - run: mise run conformance

  build-release:
    name: release build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --release

  feature-checks:
    name: feature checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - uses: xberg-io/actions/setup-mise@v1
        with:
          install: "false"
      - run: mise run feature:check

  release-packages:
    name: release package dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: xberg-io/actions/setup-mise@v1
        with:
          tools: node pnpm uv
      - run: mise run release:namespaces

  docker:
    name: docker integration
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: xberg-io/actions/setup-mise@v1
        with:
          install: "false"
      - name: Run deterministic Docker integration
        run: mise run docker:integration
        env:
          SM_PROXY_E2E_ARTIFACTS: .artifacts/docker-proxy-e2e
      - name: Upload Docker proxy logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: docker-proxy-e2e-logs
          path: .artifacts/docker-proxy-e2e
          if-no-files-found: ignore
      - run: ./scripts/publish-docker-ghcr.sh --dry-run

  security:
    name: cargo-deny and cargo-audit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - uses: xberg-io/actions/setup-mise@v1
        with:
          tools: cargo-deny github:rustsec/rustsec
      - run: mise run security
