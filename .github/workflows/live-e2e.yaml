name: Live E2E

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

concurrency:
  group: live-e2e-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  live-e2e:
    name: live upstream and native clients
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      # No rust-toolchain.toml: CI follows the stable channel. ~keep
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: xberg-io/actions/setup-mise@v1
        with:
          tools: python node pnpm ruby java maven
      # dotnet, Dart and BEAM are not installed through mise. ~keep
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - uses: dart-lang/setup-dart@v1
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.17"
      - name: Install native package clients
        run: |
          python -m pip install --upgrade pip
          gem install bundler
      - run: mise run ci:live-e2e
