name: Live E2E

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

concurrency:
  group: live-e2e-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  live-e2e:
    name: live upstream and native clients
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      # ~keep No rust-toolchain.toml; this job installs the stable channel directly.
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - uses: xberg-io/actions/setup-mise@v1
        with:
          tools: python node ruby
      # dotnet, Dart and BEAM are not installed through mise. ~keep
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      # ~keep Dart stays on its setup action (mise toolchain policy); the pub client E2E needs it.
      - uses: dart-lang/setup-dart@v1
      # ~keep BEAM stays on its setup action (mise toolchain policy); the hex client E2E needs it.
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.17"
      - name: Install native package clients
        run: |
          python -m pip install --upgrade pip
          gem install bundler
      - run: mise run ci:live-e2e
