name: Metadata CI

on:
  pull_request:
    paths:
      - "crates/starmetal-metadata/**"
      - "crates/starmetal-service/**"
      - "crates/starmetal-server/**"
      - "tests/integration/**"
      - "scythe.toml"
      - "mise.toml"
      - "mise.lock"
      - ".github/workflows/ci-metadata.yaml"
  push:
    branches:
      - main
    paths:
      - "crates/starmetal-metadata/**"
      - "crates/starmetal-service/**"
      - "crates/starmetal-server/**"
      - "tests/integration/**"
      - "scythe.toml"
      - "mise.toml"
      - "mise.lock"
      - ".github/workflows/ci-metadata.yaml"

concurrency:
  group: ci-metadata-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  metadata:
    name: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      # ~keep No rust-toolchain.toml; this job installs the stable channel directly.
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - uses: xberg-io/actions/setup-mise@v1
        with:
          tools: github:Goldziher/scythe
      - name: Verify Docker is available for testcontainers
        run: docker info
      - run: mise run db:check
      - name: Check generated SQL bindings are up to date
        run: |
          mise run db:generate
          if [ -n "$(git status --porcelain crates/starmetal-metadata/src/generated/)" ]; then
            echo "::error::Generated scythe code is out of date. Run 'mise run db:generate' and commit the changes."
            git diff crates/starmetal-metadata/src/generated/
            exit 1
          fi
      - run: mise run test:content-store
