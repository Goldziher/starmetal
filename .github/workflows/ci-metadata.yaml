name: Metadata CI

on:
  pull_request:
    paths:
      - "crates/starmetal-metadata/**"
      - "scythe.toml"
      - ".github/workflows/ci-metadata.yaml"
  push:
    branches:
      - main
    paths:
      - "crates/starmetal-metadata/**"
      - "scythe.toml"
      - ".github/workflows/ci-metadata.yaml"

concurrency:
  group: ci-metadata-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  metadata:
    name: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: go-task/setup-task@v2
        with:
          version: 3.51.1
      - name: Install scythe
        run: |
          curl -fL https://github.com/Goldziher/scythe/releases/latest/download/scythe-x86_64-unknown-linux-gnu.tar.gz | tar xz
          sudo mv scythe /usr/local/bin/
      - name: Verify Docker is available for testcontainers
        run: docker info
      - run: task db:check
      - name: Check generated SQL bindings are up to date
        run: |
          task db:generate
          if [ -n "$(git status --porcelain crates/starmetal-metadata/src/generated/)" ]; then
            echo "::error::Generated scythe code is out of date. Run 'task db:generate' and commit the changes."
            git diff crates/starmetal-metadata/src/generated/
            exit 1
          fi
      - run: task test:metadata
