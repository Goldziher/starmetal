# Generated by scripts/migrate_to_poly.py from .pre-commit-config.yaml + tool configs. Review before committing.

[defaults]
line_length = 120
line_ending = "lf"
final_newline = true
trim_trailing_whitespace = true

[discovery]
exclude = [
    "**/*.lock",
    "**/*.svg",
    "**/Cargo.lock",
    "**/go.sum",
    "**/package-lock.json",
    "**/pnpm-lock.yaml",
    "**/uv.lock",
    ".claude/**",
    "AGENTS.md",
    "CLAUDE.md",
    "dist/**",
    "node_modules/**",
    "schemas/upstream/**",
    "target/**",
    "vendor/**",
]

[lint.markdown.rumdl]
disable = ["MD012", "MD013", "MD024", "MD030", "MD033", "MD035", "MD036", "MD041", "MD046", "MD051", "MD076"]

[fmt.markdown.rumdl]
disable = ["MD012", "MD013", "MD024", "MD030", "MD033", "MD035", "MD036", "MD041", "MD046", "MD051", "MD076"]

[lint.typos]
extend_words = { ba = "ba", bre = "bre", caf = "caf", certifi = "certifi", charater = "charater", chlidren = "chlidren", cliper = "cliper", docling = "docling", edn = "edn", ein = "ein", execpt = "execpt", extention = "extention", faiure = "faiure", fith = "fith", flate = "flate", fo = "fo", formated = "formated", ges = "ges", headerr = "headerr", helo = "helo", hocr = "hocr", hom = "hom", inh = "inh", ist = "ist", iy = "iy", kreuzberg = "kreuzberg", markitdown = "markitdown", ment = "ment", mis = "mis", mkdocs = "mkdocs", mkdocstrings = "mkdocstrings", multline = "multline", nd = "nd", odf = "odf", onnx = "onnx", openwebui = "openwebui", opf = "opf", ove = "ove", pard = "pard", pdfium = "pdfium", pn = "pn", portait = "portait", pymupdf = "pymupdf", rumdl = "rumdl", similarily = "similarily", siz = "siz", specifing = "specifing", splitted = "splitted", substract = "substract", surrealdb = "surrealdb", tesseract = "tesseract", tha = "tha", thr = "thr", threed = "threed", ths = "ths", tre = "tre", unparseable = "unparseable", wasm = "wasm", webui = "webui", yor = "yor", zensical = "zensical" }
extend_identifiers = { MarkItDown = "MarkItDown", PDFium = "PDFium", PyMuPDF = "PyMuPDF", SurrealDB = "SurrealDB", WebUI = "WebUI", traineddata = "traineddata" }
extend_exclude = [
    "test_documents/",
    "fixtures/",
    "*.lock",
    "pnpm-lock.yaml",
    "target/",
    "node_modules/",
    "dist/",
    "site/",
    "docs/snippets/",
    "e2e/",
    "**/bindgen/",
    "**/stopwords/",
    "**/test_data/",
    "**/*.diff",
    "**/*.patch",
    "**/text_repair.rs",
    "CHANGELOG.md",
    "docs/CHANGELOG.md",
    "**/vendor/",
    "**/vendored/",
    "*.whl",
    "*.tar.gz",
    "*.png",
    "*.ico",
    "*.svg",
]
# NOTE: typos extend-ignore-re is NOT portable to poly (no regex-based ignore support).

# The PyPI packaging downloader was never ruff-linted under the old prek setup;
# exempt its pre-existing modernization findings so poly stays green (fix separately).
[per-file-ignores]
"packages/pypi/src/starmetal/downloader.py" = ["B904", "UP006", "UP007", "UP035", "UP045"]

[hooks]
stages = ["pre-commit"]

[hooks.builtin]
polylint = { exclude = [
    "**/*.lock",
    "**/*.svg",
    "**/Cargo.lock",
    "**/go.sum",
    "**/package-lock.json",
    "**/pnpm-lock.yaml",
    "**/uv.lock",
    ".claude/**",
    "AGENTS.md",
    "CLAUDE.md",
    "dist/**",
    "node_modules/**",
    "schemas/upstream/**",
    "target/**",
    "vendor/**",
] }
polyfmt = { exclude = [
    "**/*.lock",
    "**/*.svg",
    "**/Cargo.lock",
    "**/go.sum",
    "**/package-lock.json",
    "**/pnpm-lock.yaml",
    "**/uv.lock",
    ".claude/**",
    "AGENTS.md",
    "CLAUDE.md",
    "dist/**",
    "node_modules/**",
    "schemas/upstream/**",
    "target/**",
    "vendor/**",
] }
commit = { stages = ["commit-msg"] }
file_safety = { exclude = [
    "**/*.lock",
    "**/*.svg",
    "**/Cargo.lock",
    "**/go.sum",
    "**/package-lock.json",
    "**/pnpm-lock.yaml",
    "**/uv.lock",
    ".claude/**",
    "AGENTS.md",
    "CLAUDE.md",
    "dist/**",
    "node_modules/**",
    "schemas/upstream/**",
    "target/**",
    "vendor/**",
] }
cargo = true

# --- catalog tools (standalone binaries, PATH-probed) ---
[tools.shfmt]
enabled = true

[tools.shellcheck]
enabled = true

[tools.actionlint]
enabled = true
